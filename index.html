<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My To-Do List</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="home-container">

        <div class="home-card">

            <div class="logo">
                ✓
            </div>

            <h1>My To-Do List</h1>

            <p class="subtitle">
                Organize your day. Get things done.
            </p>


            <!-- ADD TASK -->

            <form
                action="TaskServlet"
                method="post"
                class="add-form">

                <input
                    type="hidden"
                    name="action"
                    value="add">

                <input
                    type="text"
                    name="task"
                    placeholder="What do you need to do?"
                    autocomplete="off"
                    required>

                <button type="submit">
                    Add Task
                </button>

            </form>


            <!-- VIEW TASKS -->

            <a
                href="TaskServlet"
                class="view-btn">

                View My Tasks →

            </a>

        </div>

    </div>

</body>

</html>
